<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <filter id="w" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#w)" fill="none" stroke="#f4f1ea" stroke-width="2.4" stroke-linecap="round">
    <circle cx="20" cy="20" r="13"/>
    <ellipse cx="20" cy="20" rx="13" ry="5" transform="rotate(30 20 20)"/>
    <ellipse cx="20" cy="20" rx="13" ry="5" transform="rotate(90 20 20)"/>
    <ellipse cx="20" cy="20" rx="13" ry="5" transform="rotate(150 20 20)"/>
  </g>
</svg>
