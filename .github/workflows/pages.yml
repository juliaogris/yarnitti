name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. Do not cancel in-progress runs, as
# we want to let production deployments finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Serve the single-page app on every route by copying index.html into a
      # folder per path, so a direct hit on /apricity, /about, etc. (QR codes,
      # refresh, shared links) returns the app with a 200 instead of a 404.
      - name: Fan out SPA routes
        run: |
          cd 6-wave-header
          # Each route is one folder deep, so inject <base href="../"> into the
          # copy to resolve main.js, style.css and images back to the root.
          # Keep this list in sync with ROUTES in main.js and serve.py.
          for r in apricity about spin gallery contact; do
            mkdir -p "$r"
            sed 's#<head>#<head><base href="../">#' index.html > "$r/index.html"
          done
          # A printed QR code points at the all-caps /APRICITY, so serve a real
          # 200 there too. The client router lowercases the path, so this folder
          # shows the apricity page rather than the 404 fallback.
          mkdir -p APRICITY
          sed 's#<head>#<head><base href="../">#' index.html > APRICITY/index.html
          # 404.html is served for any unmatched path, at any depth, so give it
          # an absolute base to the site root. On the apex domain yarnitti.org
          # the site root is "/".
          sed 's#<head>#<head><base href="/">#' index.html > 404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 6-wave-header
      - id: deployment
        uses: actions/deploy-pages@v4
